<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050e10">
<title>הראל × Apex · תמיכה חכמה</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect width='56' height='56' rx='15' fill='%2306141a'/%3E%3Cpath d='M12 40 L28 15' stroke='%23d4b06a' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M28 15 L44 40' stroke='%233ecfbe' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M19.5 31.5 H36.5' stroke='%23f0d79a' stroke-width='3' stroke-linecap='round' opacity='.6'/%3E%3Ccircle cx='28' cy='15' r='3.1' fill='%23fff6d8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f3fafb;
    --ink-dim: #8fa6ab;
    --ink-soft: #d0e0e3;
    --bg0: #040c0e;
    --bg1: #08181c;
    --brass: #d4b06a;
    --brass-soft: #f0d79a;
    --brass-deep: #8a6a2e;
    --teal: #3ecfbe;
    --teal-dim: #1a7a70;
    --danger: #ff8b78;
    --ok: #7dffb2;
    --line: rgba(240, 215, 154, 0.12);
    --glass: rgba(8, 28, 32, 0.55);
    --font-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --font-body: "Assistant", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--font-body);
    background: var(--bg0);
    overflow: hidden;
  }

  /* Atmospheric stage */
  .stage {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(900px 520px at 78% -5%, rgba(212, 176, 106, 0.28), transparent 55%),
      radial-gradient(700px 480px at -5% 70%, rgba(62, 207, 190, 0.16), transparent 50%),
      radial-gradient(600px 400px at 60% 110%, rgba(212, 176, 106, 0.1), transparent 55%),
      linear-gradient(160deg, #040c0e 0%, #0a1c22 45%, #061014 100%);
  }
  .stage::before {
    content: "";
    position: absolute; inset: -20%;
    background:
      conic-gradient(from 210deg at 70% 20%, transparent 0deg, rgba(212,176,106,.08) 40deg, transparent 90deg),
      conic-gradient(from 40deg at 20% 80%, transparent 0deg, rgba(62,207,190,.07) 50deg, transparent 110deg);
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(40px); pointer-events: none;
    mix-blend-mode: screen; opacity: .55;
  }
  .orb.a {
    width: 340px; height: 340px; top: -80px; right: -40px;
    background: radial-gradient(circle, rgba(240,215,154,.55), transparent 70%);
    animation: float 9s ease-in-out infinite;
  }
  .orb.b {
    width: 280px; height: 280px; bottom: 8%; left: -60px;
    background: radial-gradient(circle, rgba(62,207,190,.4), transparent 70%);
    animation: float 11s ease-in-out infinite reverse;
  }
  .orb.c {
    width: 180px; height: 180px; top: 42%; right: 18%;
    background: radial-gradient(circle, rgba(212,176,106,.22), transparent 70%);
    animation: float 13s ease-in-out infinite 1s;
  }
  .grid-fade {
    position: absolute; inset: 0; opacity: .07;
    background-image:
      linear-gradient(rgba(240,215,154,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,215,154,.35) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent);
  }
  .grain {
    position: absolute; inset: 0; opacity: .05; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .app {
    position: relative; z-index: 1;
    height: 100%;
    max-width: 820px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: max(1rem, env(safe-area-inset-top)) 1.1rem max(.9rem, env(safe-area-inset-bottom));
    gap: .9rem;
  }

  header.hero {
    display: grid;
    gap: .35rem;
    animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  .brand-row {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }

  /* Co-brand lockup: Harel (הר־אל, "mountain of God") × Apex — both mean summit,
     so the mark is a single ridge climbing to one shared peak. */
  .brand-lockup {
    position: relative;
    display: flex; align-items: center; gap: .72rem;
  }
  .brand-mark {
    width: clamp(42px, 9vw, 54px);
    height: clamp(42px, 9vw, 54px);
    flex: 0 0 auto;
    filter: drop-shadow(0 6px 18px rgba(212,176,106,.28));
    animation: mark-in .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .brand-words {
    display: flex; align-items: baseline; gap: .5rem;
    line-height: .95;
  }
  .brand-he {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.85rem);
    letter-spacing: -.03em;
    background: linear-gradient(115deg, #fff6d8 0%, var(--brass-soft) 28%, var(--brass) 55%, var(--brass-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 28px rgba(212,176,106,.22));
  }
  .brand-sep {
    font-size: clamp(.95rem, 2.6vw, 1.25rem);
    font-weight: 400;
    color: var(--ink-dim);
    opacity: .65;
    transform: translateY(-.12em);
  }
  .brand-apex {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(1rem, 2.9vw, 1.35rem);
    letter-spacing: .22em;
    text-transform: uppercase;
    background: linear-gradient(120deg, #eafffb 0%, var(--teal) 55%, var(--teal-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(62,207,190,.28));
  }
  @media (max-width: 430px) {
    .brand-words { gap: .38rem; }
    .brand-apex { letter-spacing: .14em; }
  }
  .status {
    display: inline-flex; align-items: center; gap: .45rem;
    font-size: .74rem; font-weight: 600;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    background: rgba(0,0,0,.28);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: .38rem .8rem;
    letter-spacing: .02em;
  }
  .status .dot {
    width: .5rem; height: .5rem; border-radius: 50%;
    background: var(--brass);
  }
  .status.ready {
    color: #b8f5d4;
    border-color: rgba(125,255,178,.25);
    background: rgba(125,255,178,.06);
  }
  .status.ready .dot {
    background: var(--ok);
    box-shadow: 0 0 10px rgba(125,255,178,.7);
    animation: pulse 2s infinite;
  }
  .status.down { color: #ffc4ba; border-color: rgba(255,139,120,.3); }
  .status.down .dot { background: var(--danger); }
  .tagline {
    margin: 0;
    max-width: 28rem;
    font-size: .98rem;
    color: var(--ink-dim);
    line-height: 1.45;
  }
  .tagline em {
    font-style: normal;
    color: var(--brass-soft);
  }

  .panel {
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    border-radius: 28px;
    border: 1px solid rgba(240,215,154,.14);
    background:
      linear-gradient(165deg, rgba(255,255,255,.04), transparent 35%),
      linear-gradient(180deg, rgba(18, 48, 54, 0.55), rgba(6, 18, 22, 0.82));
    box-shadow:
      0 0 0 1px rgba(0,0,0,.35) inset,
      0 40px 90px rgba(0,0,0,.45),
      0 0 80px rgba(212,176,106,.05);
    overflow: hidden;
    animation: rise .9s .08s cubic-bezier(.2,.8,.2,1) both;
  }
  .panel::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,215,154,.55), transparent);
    opacity: .8;
  }

  .thread-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }
  .thread {
    height: 100%;
    overflow-y: auto;
    padding: 1.35rem 1.2rem 1.6rem;
    display: flex;
    flex-direction: column;
    gap: 1.05rem;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: rgba(212,176,106,.3) transparent;
  }

  .empty {
    margin: auto;
    width: min(100%, 28rem);
    text-align: center;
    padding: 1.6rem .4rem 2rem;
    animation: rise .85s .15s cubic-bezier(.2,.8,.2,1) both;
  }
  .empty-mark {
    --s: 4.4rem;
    width: var(--s); height: var(--s);
    margin: 0 auto 1.1rem;
    border-radius: 1.35rem;
    display: grid; place-items: center;
    position: relative;
    font-family: var(--font-display);
    font-size: 1.85rem;
    font-weight: 700;
    color: #1a1408;
    background: linear-gradient(145deg, var(--brass-soft), var(--brass) 55%, var(--brass-deep));
    box-shadow:
      0 0 0 1px rgba(255,255,255,.2) inset,
      0 18px 40px rgba(212,176,106,.35),
      0 0 50px rgba(212,176,106,.25);
    animation: mark-in .9s cubic-bezier(.2,.8,.2,1) both, floaty 5s ease-in-out 1s infinite;
  }
  .empty-mark::before {
    content: "";
    position: absolute; inset: -10px;
    border-radius: 1.7rem;
    border: 1px solid rgba(240,215,154,.2);
    animation: ring 3.2s ease-out infinite;
  }
  .empty h2 {
    margin: 0 0 .45rem;
    font-family: var(--font-display);
    font-size: clamp(1.55rem, 4vw, 1.9rem);
    font-weight: 700;
    letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff, var(--ink-soft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .empty p {
    margin: 0 0 .55rem;
    color: var(--ink-dim);
    font-size: .98rem;
    line-height: 1.55;
  }
  .empty .empty-note {
    margin: 0 0 1.35rem;
    font-size: .8rem;
    opacity: .62;
  }
  .empty .empty-note code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .95em;
    color: var(--brass-soft);
    background: rgba(240,215,154,.07);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: .05em .35em;
    direction: ltr;
    display: inline-block;
  }
  .hints {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .5rem;
  }
  .hint {
    appearance: none;
    border: 1px solid rgba(240,215,154,.18);
    background: rgba(0,0,0,.28);
    backdrop-filter: blur(8px);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: .55rem 1.05rem;
    font: inherit;
    font-size: .86rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform .18s ease, border-color .18s, background .18s, box-shadow .18s, color .18s;
  }
  .hint:hover {
    transform: translateY(-2px);
    color: #fff;
    border-color: rgba(240,215,154,.45);
    background: rgba(212,176,106,.12);
    box-shadow: 0 10px 28px rgba(0,0,0,.25), 0 0 24px rgba(212,176,106,.12);
  }
  .hint:nth-child(1) { animation: rise .6s .25s both; }
  .hint:nth-child(2) { animation: rise .6s .35s both; }
  .hint:nth-child(3) { animation: rise .6s .45s both; }

  .row {
    display: flex;
    flex-direction: column;
    gap: .32rem;
    max-width: min(90%, 540px);
    animation: pop .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .row.user { align-self: flex-start; align-items: flex-start; }
  .row.bot { align-self: flex-end; align-items: flex-end; }
  .row.system { align-self: center; align-items: center; max-width: 26rem; }

  .who {
    display: inline-flex; align-items: center; gap: .4rem;
    font-size: .7rem;
    font-weight: 600;
    color: var(--ink-dim);
    padding: 0 .2rem;
    letter-spacing: .04em;
  }
  .who .dot {
    width: .4rem; height: .4rem; border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 8px rgba(212,176,106,.6);
  }
  .row.bot .who .dot {
    background: var(--teal);
    box-shadow: 0 0 8px rgba(62,207,190,.55);
  }

  .bubble {
    position: relative;
    padding: 1rem 1.15rem;
    border-radius: 20px;
    line-height: 1.65;
    font-size: 1.04rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    color: #1a1408;
    background: linear-gradient(145deg, #f3e0a8, var(--brass) 60%, #b89245);
    border-bottom-right-radius: 5px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.18) inset,
      0 14px 36px rgba(212,176,106,.28);
  }
  .row.bot .bubble {
    background: linear-gradient(160deg, rgba(20,48,54,.95), rgba(8,22,26,.92));
    border: 1px solid rgba(62,207,190,.18);
    border-bottom-left-radius: 5px;
    box-shadow:
      0 16px 40px rgba(0,0,0,.3),
      0 0 0 1px rgba(255,255,255,.03) inset;
  }
  .row.bot.pending .bubble {
    min-width: 11rem;
    color: var(--ink-dim);
    border-color: rgba(212,176,106,.2);
  }
  .row.system .bubble {
    text-align: center;
    font-size: .86rem;
    color: var(--ink-dim);
    padding: .55rem 1.1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,.3);
    backdrop-filter: blur(8px);
  }
  .row.error .bubble {
    border-color: rgba(255,139,120,.4);
    background: rgba(80, 24, 18, 0.55);
    color: #ffd2ca;
  }

  .meta {
    margin-top: .75rem;
    display: flex; flex-wrap: wrap; gap: .35rem;
    font-size: .7rem; color: var(--ink-dim);
  }
  .chip {
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: .2rem .55rem;
    background: rgba(255,255,255,.04);
  }
  .row.user .chip {
    border-color: rgba(26,20,8,.15);
    background: rgba(26,20,8,.08);
    color: rgba(26,20,8,.7);
  }

  .cites {
    margin-top: .8rem;
    padding-top: .7rem;
    border-top: 1px solid rgba(62,207,190,.15);
    display: grid;
    gap: .4rem;
  }
  .cites-label {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--teal);
    text-transform: uppercase;
  }
  .cite {
    font-size: .74rem;
    color: var(--ink-dim);
    border-right: 2px solid var(--teal);
    padding: .4rem .65rem;
    background: rgba(62, 207, 190, 0.07);
    border-radius: 0 12px 12px 0;
    direction: ltr;
    text-align: left;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-wrap: anywhere;
    transition: background .15s;
  }
  .cite:hover { background: rgba(62, 207, 190, 0.12); color: var(--ink-soft); }

  .composer-shell {
    position: relative;
    z-index: 3;
    padding: .75rem .85rem 1rem;
    background: linear-gradient(180deg, transparent, rgba(4,12,14,.55) 30%);
  }
  .composer {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: .5rem;
    align-items: end;
    padding: .45rem;
    border-radius: 22px;
    border: 1px solid rgba(240,215,154,.2);
    background: rgba(4, 14, 16, 0.72);
    backdrop-filter: blur(16px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 18px 50px rgba(0,0,0,.35),
      0 0 40px rgba(212,176,106,.06);
    transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within {
    border-color: rgba(240,215,154,.4);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.04) inset,
      0 18px 50px rgba(0,0,0,.4),
      0 0 0 4px rgba(212,176,106,.08),
      0 0 50px rgba(212,176,106,.1);
  }

  textarea {
    width: 100%;
    min-height: 48px;
    max-height: 140px;
    resize: none;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 1.05rem;
    padding: .7rem .55rem;
    outline: none;
  }
  textarea::placeholder { color: rgba(143, 166, 171, 0.7); }

  .icon-btn, .send-btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-weight: 700;
    border-radius: 16px;
    transition: transform .15s ease, background .2s, box-shadow .2s, opacity .2s, filter .2s;
  }
  .icon-btn {
    width: 48px; height: 48px;
    display: grid; place-items: center;
    background: rgba(62, 207, 190, 0.1);
    border: 1px solid rgba(62, 207, 190, 0.28);
    color: var(--ink);
  }
  .icon-btn:hover { transform: translateY(-1px); background: rgba(62, 207, 190, 0.18); }
  .icon-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
  .icon-btn.listening {
    background: rgba(255, 139, 120, 0.18);
    border-color: rgba(255, 139, 120, 0.55);
    color: #ffd0c7;
    animation: glow 1.1s ease-in-out infinite;
  }
  .icon-btn svg { width: 21px; height: 21px; fill: currentColor; }

  .send-btn {
    height: 48px;
    min-width: 70px;
    padding: 0 1.15rem;
    background: linear-gradient(135deg, #fff1c2, var(--brass-soft) 30%, var(--brass));
    color: #1a1408;
    box-shadow: 0 10px 28px rgba(212, 176, 106, 0.32);
  }
  .send-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

  .voice-bar {
    grid-column: 1 / -1;
    display: none;
    align-items: center;
    gap: .7rem;
    color: #ffc4ba;
    font-size: .82rem;
    font-weight: 500;
    padding: .15rem .55rem .25rem;
  }
  .voice-bar.on { display: flex; }
  .bars {
    display: flex; align-items: end; gap: 3px; height: 16px;
  }
  .bars i {
    width: 3px; height: 4px; border-radius: 2px;
    background: var(--danger);
    animation: bar 0.9s ease-in-out infinite;
  }
  .bars i:nth-child(2) { animation-delay: .1s; }
  .bars i:nth-child(3) { animation-delay: .2s; }
  .bars i:nth-child(4) { animation-delay: .3s; }
  .bars i:nth-child(5) { animation-delay: .15s; }

  .typing {
    display: inline-flex;
    align-items: center;
    gap: .65rem;
  }
  .typing-label {
    font-size: .9rem;
    background: linear-gradient(90deg, var(--ink-dim), var(--brass-soft), var(--ink-dim));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 1.8s linear infinite;
  }
  .typing-dots { display: inline-flex; gap: .28rem; align-items: center; }
  .typing-dots span {
    width: .34rem; height: .34rem; border-radius: 50%;
    background: var(--brass-soft);
    box-shadow: 0 0 8px rgba(240,215,154,.5);
    animation: bounce 1.1s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(.96); filter: blur(2px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(125,255,178,.55); }
    70% { box-shadow: 0 0 0 9px rgba(125,255,178,0); }
    100% { box-shadow: 0 0 0 0 rgba(125,255,178,0); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,139,120,.4); }
    50% { box-shadow: 0 0 0 10px rgba(255,139,120,0); }
  }
  @keyframes bar {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -18px) scale(1.05); }
  }
  @keyframes drift {
    from { transform: rotate(0deg) scale(1); }
    to { transform: rotate(8deg) scale(1.05); }
  }
  @keyframes ring {
    0% { transform: scale(.92); opacity: .7; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  @keyframes mark-in {
    from { opacity: 0; transform: scale(.7) rotate(-8deg); }
    to { opacity: 1; transform: none; }
  }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  @media (max-width: 640px) {
    .app { gap: .65rem; padding-inline: .85rem; }
    .composer { grid-template-columns: auto 1fr; }
    .send-btn { grid-column: 1 / -1; width: 100%; height: 46px; }
    .brand { font-size: 2.2rem; }
    .panel { border-radius: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
  <div class="grid-fade"></div>
  <div class="grain"></div>
</div>

<div class="app">
  <header class="hero">
    <div class="brand-row">
      <div class="brand-lockup">
        <svg class="brand-mark" viewBox="0 0 56 56" role="img" aria-label="הראל × Apex">
          <defs>
            <linearGradient id="mkTile" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#123036"/>
              <stop offset="100%" stop-color="#06141a"/>
            </linearGradient>
            <linearGradient id="mkBrass" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#8a6a2e"/>
              <stop offset="45%" stop-color="#d4b06a"/>
              <stop offset="100%" stop-color="#fff6d8"/>
            </linearGradient>
            <linearGradient id="mkTeal" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#1a7a70"/>
              <stop offset="100%" stop-color="#6ef0dd"/>
            </linearGradient>
          </defs>
          <rect x="1.2" y="1.2" width="53.6" height="53.6" rx="15" fill="url(#mkTile)"
                stroke="rgba(240,215,154,.28)" stroke-width="1.2"/>
          <!-- shared summit: brass flank rises, teal flank descends -->
          <path d="M 12 40 L 28 15" stroke="url(#mkBrass)" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 28 15 L 44 40" stroke="url(#mkTeal)" stroke-width="5" stroke-linecap="round" fill="none"/>
          <!-- ridge line -->
          <path d="M 19.5 31.5 H 36.5" stroke="rgba(240,215,154,.55)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="28" cy="15" r="3.1" fill="#fff6d8"/>
          <circle cx="28" cy="15" r="6.2" fill="none" stroke="rgba(255,246,216,.28)" stroke-width="1.1"/>
        </svg>
        <div class="brand-words">
          <span class="brand-he">הראל</span>
          <span class="brand-sep">×</span>
          <span class="brand-apex">Apex</span>
        </div>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">מתחבר…</span></div>
    </div>
    <p class="tagline">תשובות מבוססות <em>מסמכי החברה</em> — הקלידו, או לחצו מיקרופון ודברו.</p>
  </header>

  <section class="panel" aria-label="שיחה">
    <div class="thread-wrap">
      <div class="thread" id="thread">
        <div class="empty" id="empty">
          <div class="empty-mark" aria-hidden="true">
            <svg viewBox="0 0 56 56" width="60%" height="60%">
              <path d="M 12 40 L 28 15" stroke="#2a2008" stroke-width="5.5" stroke-linecap="round" fill="none"/>
              <path d="M 28 15 L 44 40" stroke="#2a2008" stroke-width="5.5" stroke-linecap="round" fill="none" opacity=".55"/>
              <path d="M 19.5 31.5 H 36.5" stroke="#2a2008" stroke-width="3.2" stroke-linecap="round" opacity=".8"/>
            </svg>
          </div>
          <h2>במה אפשר לעזור?</h2>
          <p>פוליסות, תביעות וכיסויים — עם ציטוט למקור.<br>בחרו דוגמה או שאלו חופשי.</p>
          <p class="empty-note">למענה קולי: Chrome בכתובת <code>127.0.0.1:8000</code></p>
          <div class="hints" id="hints">
            <button type="button" class="hint" data-q="הגשתי תביעה לחברת הביטוח. האם זה עוצר את מרוץ ההתיישנות?">התיישנות תביעה</button>
            <button type="button" class="hint" data-q="אושפזתי בחו״ל מעל שלושה ימים — האם משלמים על כרטיס טיסה למלווה?">מלווה בחו״ל</button>
            <button type="button" class="hint" data-q="אילו ביטוחי משכנתא יש בהראל ואיך מצטרפים לביטוח חיים למשכנתא?">משכנתא</button>
          </div>
        </div>
      </div>
    </div>
    <div class="composer-shell">
      <form class="composer" id="form">
        <button type="button" class="icon-btn" id="mic" title="הקלטה קולית" aria-label="הקלטה קולית">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="שאלה בעברית…" dir="rtl"></textarea>
        <button type="submit" class="send-btn" id="send">שלח</button>
        <div class="voice-bar" id="voiceBar">
          <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <span id="voiceLabel">מקשיב… דברו בעברית</span>
        </div>
      </form>
    </div>
  </section>
</div>

<script>
(() => {
  const API = (location.origin.includes("8000") || location.protocol.startsWith("http"))
    ? location.origin
    : "http://127.0.0.1:8000";

  const thread = document.getElementById("thread");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const micBtn = document.getElementById("mic");
  const voiceBar = document.getElementById("voiceBar");
  const voiceLabel = document.getElementById("voiceLabel");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  let busy = false;
  let listening = false;
  let recognition = null;
  let baseBeforeVoice = "";
  let started = false;

  function hideEmpty() {
    if (!started && empty) {
      empty.style.transition = "opacity .25s ease, transform .25s ease";
      empty.style.opacity = "0";
      empty.style.transform = "scale(.96)";
      setTimeout(() => empty.remove(), 220);
      started = true;
    }
  }

  function cleanAnswer(text) {
    return String(text || "")
      .replace(/\n*USED_PASSAGES:\s*[^\n]*$/i, "")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function shortFile(path) {
    if (!path) return "?";
    const parts = String(path).split(/[\\/]/);
    return parts[parts.length - 1] || path;
  }

  function addRow(role, text, extras = {}) {
    hideEmpty();
    const row = document.createElement("div");
    row.className = `row ${role}` + (extras.error ? " error" : "") + (extras.pending ? " pending" : "");

    if (role === "user" || role === "bot") {
      const who = document.createElement("div");
      who.className = "who";
      who.innerHTML = `<span class="dot"></span>${role === "user" ? "אתם" : "הראל"}`;
      row.appendChild(who);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (extras.pending) {
      bubble.innerHTML =
        '<span class="typing"><span class="typing-label">מחפש במסמכים</span><span class="typing-dots"><span></span><span></span><span></span></span></span>';
    } else {
      bubble.textContent = text;
    }
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return { row, bubble };
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    input.disabled = v;
    if (!listening) micBtn.disabled = v;
  }

  async function checkHealth() {
    try {
      const r = await fetch(`${API}/health`, { cache: "no-store" });
      const j = await r.json();
      statusEl.classList.toggle("ready", !!j.ready);
      statusEl.classList.toggle("down", !j.ready);
      statusText.textContent = j.ready ? "מוכן" : "נטען…";
    } catch {
      statusEl.classList.remove("ready");
      statusEl.classList.add("down");
      statusText.textContent = "אין חיבור";
    }
  }

  async function ask(question) {
    const q = (question || "").trim();
    if (!q || busy) return;
    stopVoice(false);
    addRow("user", q);
    setBusy(true);
    const { row, bubble } = addRow("bot", "", { pending: true });

    try {
      const r = await fetch(`${API}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      row.classList.remove("pending");
      bubble.textContent = cleanAnswer(data.answer) || "(תשובה ריקה)";

      const meta = [];
      if (data.domain) meta.push(data.domain);
      if (data.latency_ms != null) {
        const s = data.latency_ms / 1000;
        meta.push(s >= 10 ? `${s.toFixed(0)} שנ׳` : `${s.toFixed(1)} שנ׳`);
      }
      if (data.confidence != null) meta.push(`${(data.confidence * 100).toFixed(0)}%`);

      if (meta.length) {
        const m = document.createElement("div");
        m.className = "meta";
        meta.forEach((t) => {
          const c = document.createElement("span");
          c.className = "chip";
          c.textContent = t;
          m.appendChild(c);
        });
        bubble.appendChild(m);
      }
      if (data.citations && data.citations.length) {
        const box = document.createElement("div");
        box.className = "cites";
        const lab = document.createElement("div");
        lab.className = "cites-label";
        lab.textContent = "מקורות";
        box.appendChild(lab);
        data.citations.forEach((c) => {
          const rowCite = document.createElement("div");
          rowCite.className = "cite";
          const page = c.page != null ? ` · p${c.page}` : "";
          rowCite.textContent = `${shortFile(c.file)}${page}`;
          rowCite.title = c.file || "";
          box.appendChild(rowCite);
        });
        bubble.appendChild(box);
      }
    } catch (e) {
      row.classList.remove("pending");
      row.classList.add("error");
      bubble.textContent = `לא הצלחנו לקבל תשובה (${e.message}).`;
    } finally {
      setBusy(false);
      input.value = "";
      autosize();
      input.focus();
      thread.scrollTop = thread.scrollHeight;
    }
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(140, Math.max(48, input.scrollHeight)) + "px";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    ask(input.value);
  });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      ask(input.value);
    }
  });

  document.getElementById("hints").addEventListener("click", (e) => {
    const btn = e.target.closest(".hint");
    if (!btn) return;
    ask(btn.dataset.q);
  });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micHostOk = (() => {
    const h = location.hostname;
    return (
      window.isSecureContext ||
      h === "localhost" ||
      h === "127.0.0.1" ||
      h === "[::1]"
    );
  })();
  const micErrorHe = {
    "not-allowed": "אין הרשאה למיקרופון. בדפדפן: מנעול ליד הכתובת → מיקרופון → אפשר. גם ב־System Settings → Privacy → Microphone אשרו ל־Chrome.",
    "service-not-allowed": "הדפדפן חסם את שירות הזיהוי. פתחו ב־Chrome מ־http://127.0.0.1:8000",
    "audio-capture": "לא נמצא מיקרופון, או שהוא בשימוש באפליקציה אחרת.",
    "network": "זיהוי דיבור של Chrome דורש רשת (שירות ענן). בדקו חיבור לאינטרנט.",
    "no-speech": "לא נשמע דיבור — נסו שוב קרוב למיקרופון.",
    "aborted": null,
  };

  function micBlockedReason() {
    if (!SR) {
      return "זיהוי דיבור דורש Chrome או Edge (לא Safari / לא תצוגת Cursor). אפשר להקליד.";
    }
    if (!micHostOk) {
      return `מיקרופון חסום בכתובת הזו (${location.host}). פתחו במקום: http://127.0.0.1:8000/`;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return "הדפדפן לא מאפשר גישה למיקרופון בהקשר הנוכחי. השתמשו ב־Chrome ב־http://127.0.0.1:8000/";
    }
    return null;
  }

  async function ensureMicPermission() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((t) => t.stop());
  }

  if (!SR || !micHostOk) {
    const why = micBlockedReason();
    micBtn.title = why || "מיקרופון לא זמין";
    micBtn.addEventListener("click", () => {
      addRow("system", why || "מיקרופון לא זמין.");
    });
  } else {
    recognition = new SR();
    recognition.lang = "he-IL";
    recognition.interimResults = true;
    // false + restart-on-end is more reliable on Chrome/macOS than continuous=true
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add("listening");
      voiceBar.classList.add("on");
      voiceLabel.textContent = "מקשיב… דברו בעברית";
    };
    recognition.onerror = (ev) => {
      const code = ev.error || "unknown";
      const msg = micErrorHe[code];
      if (code === "aborted") return;
      voiceLabel.textContent = msg ? `שגיאה: ${code}` : `שגיאת מיקרופון: ${code}`;
      if (msg) addRow("system", msg);
      if (code === "not-allowed" || code === "service-not-allowed" || code === "audio-capture") {
        stopVoice(false);
      }
    };
    recognition.onend = () => {
      if (!listening) return;
      // Keep listening until the user taps the mic again.
      try {
        recognition.start();
      } catch (_) {
        stopVoice(false);
      }
    };
    recognition.onresult = (event) => {
      let interim = "";
      let final = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t;
        else interim += t;
      }
      if (final) {
        baseBeforeVoice = (
          baseBeforeVoice +
          (baseBeforeVoice && !/\s$/.test(baseBeforeVoice) ? " " : "") +
          final
        ).trim();
        input.value = baseBeforeVoice;
      } else {
        input.value = (baseBeforeVoice + (baseBeforeVoice ? " " : "") + interim).trim();
      }
      autosize();
    };

    micBtn.addEventListener("click", async () => {
      if (busy) return;
      if (listening) {
        stopVoice(true);
        return;
      }
      const blocked = micBlockedReason();
      if (blocked) {
        addRow("system", blocked);
        return;
      }
      baseBeforeVoice = input.value.trim();
      voiceBar.classList.add("on");
      voiceLabel.textContent = "מבקש גישה למיקרופון…";
      try {
        await ensureMicPermission();
      } catch (e) {
        voiceBar.classList.remove("on");
        const name = (e && e.name) || "";
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          addRow("system", micErrorHe["not-allowed"]);
        } else if (name === "NotFoundError") {
          addRow("system", micErrorHe["audio-capture"]);
        } else {
          addRow("system", "לא הצלחנו לפתוח את המיקרופון. בדקו Chrome + http://127.0.0.1:8000/");
        }
        return;
      }
      listening = true;
      try {
        recognition.start();
      } catch (e) {
        listening = false;
        voiceBar.classList.remove("on");
        addRow("system", "לא הצלחנו להתחיל האזנה. נסו שוב בעוד רגע.");
      }
    });
  }

  function stopVoice(announce) {
    listening = false;
    micBtn.classList.remove("listening");
    voiceBar.classList.remove("on");
    try { recognition && recognition.stop(); } catch (_) {}
    if (announce && input.value.trim()) {
      voiceLabel.textContent = "הושלם — אפשר לשלוח";
    }
  }

  checkHealth();
  setInterval(checkHealth, 15000);
  autosize();
  input.focus();
})();
</script>
</body>
</html>
